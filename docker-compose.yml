version: "3.9"

services:
  backend:
    build: ./backend
    container_name: reddit-backend
    ports:
      - "5050:5050"
    volumes:
      - ./backend/data:/app/data   # persist SQLite DB
    environment:
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: reddit-frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true   # helps React dev server inside Docker
    depends_on:
      - backend
    restart: unless-stopped

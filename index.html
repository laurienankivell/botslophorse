<!DOCTYPE html>
<html>
<head>
    <title>Botslop Horse - Live Rants</title>
    <style>
        body { 
            font-family: monospace; 
            background: #222; 
            color: #0f0; 
            text-align: center; 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
        }
        #horse-img {
    /* 1. LOCK THE HEIGHT */
    /* This forces both images to be exactly 50% of the screen height. */
    /* Want it bigger? Change to 60vh. Smaller? Change to 40vh. */
    height: 60vh; 

    /* 2. AUTO WIDTH */
    /* This tells the browser: "Calculate the width automatically based on the height I just set." */
    width: auto; 

    /* 3. CENTER IT */
    display: block;
    margin: 20px auto;
    
    /* 4. SAFETY NET */
    /* This ensures that if the images have slightly different shapes, */
    /* they won't stretch or squish. They will fit inside the box perfectly. */
    object-fit: contain; 
    
    /* Optional: Keeps the border consistent */
    border: 5px solid #0f0;
    background: #000;
}
        .controls {
            position: fixed; 
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: rgba(34, 34, 34, 0.9); 
        }
        button { 
            padding: 15px 30px; 
            font-size: 1.2em; 
            cursor: pointer; 
            background: #0f0; 
            color: #000; 
            border: none; 
            font-family: monospace; 
            font-weight: bold;
            margin: 0 10px;
        }
        button:hover { 
            background: #fff; 
        }
    </style>
</head>
<body>

    <h1 style="margin-top: 10px;">🐎 THE BOTSLOP HORSE 🐎</h1>

    <img id="horse-img" src="horse_silent.png" alt="Horse">
    
    <div class="controls">
        <button onclick="startRanting()">📢 Start Ranting</button>
        <button onclick="stopAndSkip()">➡️ Next Rant</button>
        <button onclick="stopAndSilence()">🛑 Stop Ranting</button>
    </div>

    <script>
        let comments = [];
        let commentIndex = 0; 
        let isStopped = true; // 🚩 The "Safety Switch"
        const synth = window.speechSynthesis;
        const horseImg = document.getElementById('horse-img');

        // --- 1. Load the Data from the NEW automated JSON file ---
        fetch('live_horse_data.json') 
            .then(response => response.json())
            .then(data => {
                // This maps the 'text' field from your Python JSON into our speech list
                comments = data.map(item => item.text); 
                console.log("Horse is loaded with " + comments.length + " rants.");
            })
            .catch(err => {
                console.error("Data failed to load.", err);
            })

        // --- 2. Control Functions ---
        function speakComment(text) {
            synth.cancel(); 

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.8; 
            utterance.pitch = 0.7; 

            utterance.onstart = () => {
                horseImg.src = "horse_talking.gif"; 
            };

            utterance.onend = () => {
                horseImg.src = "horse_silent.png"; 
                // 🛑 ONLY move to the next rant if the user hasn't pressed 'Stop'
                if (!isStopped) {
                    setTimeout(playNext, 2000); // 2-second breath between rants
                }
            };

            synth.speak(utterance);
        }

        function playNext() {
            if (comments.length === 0) return;

            // If we hit the end, loop back to the start
            if (commentIndex >= comments.length) {
                commentIndex = 0;
            }

            const nextComment = comments[commentIndex];
            commentIndex++; 
            speakComment(nextComment);
        }

        // --- 3. Button Actions ---
        function startRanting() {
            if (isStopped) {
                isStopped = false; // Turn the switch ON
                playNext();
            }
        }

        function stopAndSkip() {
            isStopped = false; // Keep the flow going
            synth.cancel(); // This will trigger 'onend' and move us to the next automatically
        }

        function stopAndSilence() {
            isStopped = true; // 🛑 Turn the switch OFF
            synth.cancel(); // Silence the voice
            horseImg.src = "horse_silent.png"; 
        }
    </script>
</body>
</html>

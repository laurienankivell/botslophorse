<!DOCTYPE html>
<html>
<head>
    <title>Botslop Horse - Live Rants</title>
    <style>
        body { 
            font-family: monospace; 
            background: #222; 
            color: #0f0; 
            text-align: center; 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
        }
        #horse-img { 
            max-width: 90vw; 
            max-height: 80vh; 
            width: auto; 
            height: auto; 
            border: 5px solid #0f0; 
            margin: 20px auto;
        }
        .controls {
            position: fixed; 
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: rgba(34, 34, 34, 0.9); 
        }
        button { 
            padding: 15px 30px; 
            font-size: 1.2em; 
            cursor: pointer; 
            background: #0f0; 
            color: #000; 
            border: none; 
            font-family: monospace; 
            font-weight: bold;
            margin: 0 10px;
        }
        button:hover { 
            background: #fff; 
        }
    </style>
</head>
<body>

    <h1 style="margin-top: 10px;">🐎 THE BOTSLOP HORSE 🐎</h1>

    <img id="horse-img" src="horse_silent.png" alt="Horse">
    
    <div class="controls">
        <button onclick="startRanting()">📢 Start Ranting</button>
        <button onclick="stopAndSkip()">➡️ Next Rant</button>
        <button onclick="stopAndSilence()">🛑 Stop Ranting</button>
    </div>

    <script>
        let comments = [];
        let commentIndex = 0; 
        const synth = window.speechSynthesis;
        const horseImg = document.getElementById('horse-img');

        // --- 1. Load the Data from the NEW automated JSON file ---
        fetch('live_horse_data.json') 
            .then(response => response.json())
            .then(data => {
                // This maps the 'text' field from your Python JSON into our speech list
                comments = data.map(item => item.text); 
                console.log("Automation Sync Complete. " + comments.length + " rants ready.");
            })
            .catch(err => {
                console.error("Error loading JSON. Bot might not have run yet.", err);
            });

        // --- 2. Control Functions ---
        function speakComment(text) {
            synth.cancel(); 

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.7; 
            utterance.pitch = 0.8; 

            utterance.onstart = () => {
                horseImg.src = "horse_talking.gif"; 
            };

            utterance.onend = () => {
                horseImg.src = "horse_silent.png"; 
                // Automatically move to the next comment after a pause
                setTimeout(playNext, 1000); 
            };

            synth.speak(utterance);
        }

        function playNext() {
            synth.cancel(); 

            if (comments.length === 0) {
                alert("The horse has nothing to say yet. Check if live_horse_data.json exists!");
                return;
            }

            if (commentIndex < comments.length) {
                const nextComment = comments[commentIndex];
                commentIndex++; 
                speakComment(nextComment);
            } else {
                horseImg.src = "horse_silent.png";
                commentIndex = 0; // Loop back
                alert("Rants Finished. Looping back to start.");
            }
        }

        function stopAndSkip() {
            synth.cancel(); 
            setTimeout(playNext, 100); 
        }

        function stopAndSilence() {
            synth.cancel(); 
            horseImg.src = "horse_silent.png"; 
        }
        
        function startRanting() {
            playNext();
        }
    </script>
</body>
</html>
